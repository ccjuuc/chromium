# Use the Chromium DLL's CRT when wrapping a static Tongsuo archive. Upstream's
# no-shared Windows target otherwise selects /MT. No upstream source is patched.
my %targets = (
    "chromium-VC-WIN64A" => {
        inherit_from => [ "VC-WIN64A" ],
        lib_cflags => picker(debug => "/MDd /Zi /Fdossl_static.pdb",
                             release => "/MD"),
    },
);
