# Burn + Llama 3.2 1B Instruct sidecar. Built automatically when `enable_xenon_ai`
# via GN action `//xenon_overlay/xenon_ai_inferencer_burn:xenon_ai_inferencer_burn`
# (runs `cargo build --release`; needs `cargo` on PATH).
#
# Manual: cargo build --release
#
# Default: Vulkan + f16 (GPU, larger binary, faster).
# Smaller binary / fewer deps (CPU only, much slower on 1B):
#   cargo build --release --no-default-features --features backend_ndarray
#
# Copy xenon_ai_inferencer_burn.exe next to chrome.exe.
# First run downloads ~2GB model.mpk from Hugging Face (llama-burn pretrained).

[package]
name = "xenon_ai_inferencer_burn"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "xenon_ai_inferencer_burn"
path = "src/main.rs"

[features]
default = ["backend_vulkan"]
# wgpu + Vulkan stack; best throughput if GPU is available.
backend_vulkan = ["burn/vulkan", "llama-burn/vulkan"]
# Pure-Rust CPU ndarray; smaller exe and dependency closure; slow for LLM.
backend_ndarray = ["burn/ndarray", "llama-burn/ndarray"]

[dependencies]
burn = { version = "0.20.1", default-features = false, features = ["std"] }
llama-burn = { git = "https://github.com/tracel-ai/models", package = "llama-burn", default-features = false, features = [
    "llama3",
    "pretrained",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
