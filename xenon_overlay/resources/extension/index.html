<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Xenon Overlay</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      max-width: 400px;
      margin: 0;
      padding: 0;
      background-color: rgba(32, 33, 36, 0.95);
      color: #e8eaed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 13px;
      user-select: none;
    }
    .title-bar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background-color: rgba(0, 0, 0, 0.25);
      -webkit-app-region: drag;
    }
    .title-bar span {
      font-size: 13px;
      font-weight: 600;
    }
    .close-btn {
      -webkit-app-region: no-drag;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
    }
    .close-btn:hover {
      background-color: rgba(255, 255, 255, 0.12);
    }
    .content {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #8ab4f8;
    }
    .hint {
      margin: 0;
      line-height: 1.45;
      color: #9aa0a6;
      font-size: 12px;
    }
    .section-label {
      margin: 4px 0 0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #80868b;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      padding: 10px 14px;
      background-color: #8ab4f8;
      border: none;
      border-radius: 6px;
      color: #202124;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }
    button.secondary {
      background-color: #3c4043;
      color: #e8eaed;
      font-weight: 500;
    }
    button:hover {
      filter: brightness(1.06);
    }
    button:active {
      filter: brightness(0.94);
    }
    #log {
      margin: 0;
      padding: 10px;
      min-height: 72px;
      max-height: 140px;
      overflow: auto;
      background: #202124;
      border-radius: 6px;
      border: 1px solid #3c4043;
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      font-size: 11px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
      color: #bdc1c6;
    }
    .log-empty {
      color: #80868b;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="title-bar">
    <span>Xenon 组件扩展</span>
    <div class="close-btn" id="closeBtn" title="关闭">✕</div>
  </div>
  <div class="content">
    <h1>测试面板</h1>
    <p class="hint">
      由内置组件扩展加载。下方按钮分别对应 Browser 私有 API、runtime 信息与到 background 的消息（见 Service Worker 控制台）。
    </p>

    <p class="section-label">embedder API</p>
    <div class="btn-row">
      <button id="btnXenonPrivatePing" type="button">
        ① chrome.xenonPrivate.ping<br>
        <span style="font-weight:400;font-size:11px;opacity:.85">期望回调字符串 xenon-private-pong</span>
      </button>
    </div>

    <p class="section-label">chrome.runtime</p>
    <div class="btn-row">
      <button id="btnRuntimeId" type="button" class="secondary">② 显示扩展 ID（runtime.id）</button>
      <button id="btnPingBackground" type="button" class="secondary">③ 发消息到 background（action: ping）</button>
    </div>

    <p class="section-label">输出</p>
    <pre id="log" class="log-empty">点击按钮后日志出现在此处…</pre>
  </div>
  <script src="main.js"></script>
</body>
</html>
