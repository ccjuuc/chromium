<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Xenon Overlay</title>
  <style>
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: rgba(32, 33, 36, 0.9); /* Dark semi-transparent */
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    .title-bar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background-color: rgba(0, 0, 0, 0.2);
      -webkit-app-region: drag; /* Draggable area */
    }
    .title-bar span {
      font-size: 14px;
      font-weight: 500;
    }
    .close-btn {
      -webkit-app-region: no-drag;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }
    .close-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      background-color: #8ab4f8;
      border: none;
      border-radius: 4px;
      color: #202124;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #a6c8ff;
    }
  </style>
</head>
<body>
  <div class="title-bar">
    <span>Xenon Overlay Extension</span>
    <div class="close-btn" id="closeBtn">✕</div>
  </div>
  <div class="content">
    <h1>Hello from Extension!</h1>
    <p>This is a component extension loaded in a WebDialog.</p>
    <button id="actionBtn">Click Me</button>
  </div>
  <script src="main.js"></script>
</body>
</html>
