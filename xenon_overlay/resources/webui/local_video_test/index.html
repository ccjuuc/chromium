<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地 Video 测试页</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #111;
      color: #eee;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    video {
      width: 100%;
      max-height: 70vh;
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
    }
    code {
      background: #1f1f1f;
      padding: 2px 6px;
      border-radius: 4px;
    }
    button {
      margin-top: 12px;
      margin-right: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    #log {
      margin-top: 12px;
      padding: 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.5;
      max-height: 280px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>本地 Video 测试页</h2>
    <p>页面：<code>chrome://local-video-test/</code></p>
    <p>测试地址：<code>https://www.w3schools.com/html/mov_bbb.mp4</code></p>
    <video id="video" controls preload="auto">
      <!-- <source src="https://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4"> -->
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      你的浏览器不支持 video 标签。
    </video>
    <div>
      <button id="btnPlay">播放</button>
      <button id="btnPause">暂停</button>
      <button id="btnReload">重载</button>
      <button id="btnMute">静音/取消静音</button>
    </div>
    <div id="log"></div>
  </div>

  <script>
    const video = document.getElementById("video");
    const logEl = document.getElementById("log");

    function log(msg) {
      const t = new Date().toLocaleTimeString();
      logEl.textContent += `[${t}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    [
      "loadstart", "loadedmetadata", "loadeddata", "canplay", "canplaythrough",
      "play", "playing", "pause", "seeking", "seeked", "waiting",
      "stalled", "timeupdate", "ended", "error"
    ].forEach((evt) => {
      video.addEventListener(evt, () => {
        let extra = "";
        if (evt === "error" && video.error) {
          extra = ` code=${video.error.code}`;
        }
        log(`${evt}${extra} currentTime=${video.currentTime.toFixed(2)}`);
      });
    });

    document.getElementById("btnPlay").addEventListener("click", async () => {
      try {
        await video.play();
      } catch (e) {
        log(`play() failed: ${e && e.message ? e.message : e}`);
      }
    });
    document.getElementById("btnPause").addEventListener("click", () => video.pause());
    document.getElementById("btnReload").addEventListener("click", () => {
      video.load();
      log("manual reload()");
    });
    document.getElementById("btnMute").addEventListener("click", () => {
      video.muted = !video.muted;
      log(`muted=${video.muted}`);
    });

    log("页面已加载，点击播放开始测试。");
  </script>
</body>
</html>
