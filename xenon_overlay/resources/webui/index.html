<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Xenon Overlay</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="glass-container">
    <div class="title-bar">
      <div class="logo">
        <span class="logo-icon">X</span>
        <span class="logo-text">Xenon Overlay</span>
      </div>
      <div class="window-controls">
        <button id="close-btn" class="control-btn close">
          <svg viewBox="0 0 10 10" width="10" height="10">
            <path d="M1,1 L9,9 M9,1 L1,9" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      </div>
    </div>
    
    <div class="content">
      <div class="hero-section">
        <h1>Welcome to Xenon</h1>
        <p>Advanced Overlay System</p>
        <button id="action-btn" class="primary-btn">Connect Service</button>
      </div>

      <div class="status-card">
        <div class="status-item">
          <span class="label">Status</span>
          <span id="status-text" class="value ready">Ready</span>
        </div>
        <div class="status-item">
          <span class="label">Latency</span>
          <span class="value">0ms</span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="index.js"></script>
</body>
</html>
