<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPE — 通用 Electron 容器测试</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app-container">
    <header class="titlebar" data-draggable="true">
      <div class="titlebar-drag">
        <div class="logo-badge">
          <span class="logo-icon">⚡</span>
          <span class="logo-text">XPE</span>
          <span class="mode-badge">Generic Electron Container</span>
        </div>
      </div>
      <div class="window-controls">
        <button id="btn-minimize" class="win-btn" title="最小化">─</button>
        <button id="btn-maximize" class="win-btn" title="最大化">□</button>
        <button id="btn-close" class="win-btn win-close" title="关闭">✕</button>
      </div>
    </header>

    <main class="main-content">
      <section class="card status-card">
        <div class="card-header">
          <div class="indicator-group">
            <span id="status-dot" class="status-dot connected"></span>
            <h2>Electron 容器实时连接状态</h2>
          </div>
          <button id="btn-ping" class="btn btn-secondary">⚡ Ping Main 进程</button>
        </div>
        <div class="grid-stats">
          <div class="stat-item">
            <span class="stat-label">Main 进程状态</span>
            <span id="main-status" class="stat-value text-green">运行中 (Active)</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">IPC 模式</span>
            <span class="stat-value text-blue">Mojo ↔ window.require('electron')</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Chrome 内核版本</span>
            <span id="chrome-version" class="stat-value">-</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">V8 引擎版本</span>
            <span id="v8-version" class="stat-value">-</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Node 兼容版本</span>
            <span id="node-version" class="stat-value">-</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">平台 / 架构</span>
            <span id="platform-arch" class="stat-value">-</span>
          </div>
        </div>
      </section>

      <div class="workspace-grid">
        <section class="card control-card">
          <div class="card-header">
            <h3>🎮 IPC 双向测试</h3>
          </div>
          <div class="card-body">
            <div class="button-group">
              <button id="btn-get-counter" class="btn btn-primary">
                📊 同步计数 (sendSync)
              </button>
              <button id="btn-async-add" class="btn btn-primary">
                ➕ 异步计算 (invoke)
              </button>
              <button id="btn-get-paths" class="btn btn-secondary">
                📁 读取系统路径 (app.getPath)
              </button>
              <button id="btn-test-addon" class="btn btn-accent">
                🔌 测试可选 N-API (.node) 插件
              </button>
            </div>

            <div class="custom-ipc-box">
              <h4>自定义 IPC 发送器</h4>
              <div class="input-row">
                <input id="ipc-channel" type="text" placeholder="Channel (如 test:increment)" value="test:increment">
                <input id="ipc-payload" type="text" placeholder="Payload JSON (如 5)" value="5">
              </div>
              <div class="action-row">
                <button id="btn-send-invoke" class="btn btn-outline">ipcRenderer.invoke()</button>
                <button id="btn-send-async" class="btn btn-outline">ipcRenderer.send()</button>
                <button id="btn-send-sync" class="btn btn-outline">ipcRenderer.sendSync()</button>
              </div>
            </div>

            <div class="tip-box">
              <span class="tip-icon">💡</span>
              <span class="tip-text">
                <strong>跨页面持久性验证：</strong>在控制台累加计数后，按 <kbd>F5</kbd> 刷新此页面，Main 进程状态不会重置，数据依然保持！
              </span>
            </div>
          </div>
        </section>

        <section class="card log-card">
          <div class="card-header">
            <h3>📜 实时 IPC 通信日志流</h3>
            <button id="btn-clear-log" class="btn btn-sm btn-ghost">清空日志</button>
          </div>
          <div class="card-body">
            <div id="log-container" class="log-container"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="index.js"></script>
</body>
</html>
