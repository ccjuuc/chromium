<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xenon 登录</title>
  <link rel="stylesheet" href="login.css">
  <script type="module" src="login.js"></script>
</head>
<body>
  <div class="login-root">
    <header class="login-title-bar">
      <span class="title">Xenon</span>
      <div class="window-actions">
        <button id="login-close-btn" type="button" class="login-close-btn" title="关闭" aria-label="关闭登录窗口">
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
            <path d="M1,1 L9,9 M9,1 L1,9" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      </div>
    </header>
    <main class="login-body">
      <div class="login-card">
        <p class="eyebrow">你的账号 · 你的设备</p>
        <h1 id="loginHeading">登录 Xenon</h1>
        <p class="login-hint">在不同设备上使用同一个账号，找到自己的设备。</p>
        <div class="account-modes" aria-label="账号操作">
          <button id="loginMode" type="button" aria-pressed="true">登录</button>
          <button id="registerMode" type="button" aria-pressed="false">注册账号</button>
        </div>
        <form id="loginForm">
          <fieldset id="loginFields" disabled>
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[A-Za-z0-9._\-]{3,64}" minlength="3" maxlength="64" placeholder="3–64 位字母、数字或 . _ -" required>
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="256" placeholder="至少 12 位" required>
            <div id="confirmPasswordField" hidden>
              <label for="confirmPassword">确认密码</label>
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required disabled>
            </div>
          </fieldset>
          <p id="loginError" class="login-error" role="alert" hidden></p>
          <p id="loginStatus" class="login-status" role="status">正在恢复登录状态…</p>
          <button id="loginSubmit" type="submit" class="primary-btn" disabled>登录</button>
        </form>
        <p class="session-hint">登录成功后，下次启动会自动登录。</p>
      </div>
    </main>
  </div>
</body>
</html>
