<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Xenon 登录</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-root">
    <header class="login-title-bar">
      <span class="title">Xenon 登录</span>
      <div class="window-actions">
        <button id="login-close-btn" type="button" class="login-close-btn" title="关闭">
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
            <path d="M1,1 L9,9 M9,1 L1,9" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      </div>
    </header>
    <main class="login-body">
      <div class="login-card">
        <h2 class="login-heading">请先登录</h2>
        <p class="login-hint">验证完成后点击下方按钮以打开主窗口（由宿主调用业务登录逻辑）。</p>
        <div class="login-actions">
          <button id="login-done-btn" type="button" class="primary-btn">完成登录</button>
          <button id="logout-test-btn" type="button" class="primary-btn secondary-outline">测试登出</button>
        </div>
      </div>
    </main>
  </div>
  <script src="login.js"></script>
</body>
</html>
